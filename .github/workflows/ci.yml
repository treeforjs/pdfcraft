name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly fuzzing

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A newer push to a PR branch cancels its older run. Runs on main are never cancelled, so they
# finish and save the dependency cache that PR runs restore.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Main deletes the saved build its own save replaces.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # No macOS on PRs, main or nightly: the org's 5 macOS slots are kept for release builds,
        # and release.yml builds macOS (a failing release is fixed and rebuilt). Windows is off
        # for now too (Linux-only CI while parity PRs land); release.yml and windows-arm64.yml on
        # main still build it.
        os: [ubuntu-latest]
    env:
      # Full debug info for ~60 test binaries fills the hosted runner's disk; line tables keep
      # backtraces readable at a fraction of the size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      # Unused toolchains in the image are deleted in the background: it took 1.5 minutes in the
      # foreground, and the space is free long before the test build needs it.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            </dev/null >/dev/null 2>&1 &

      # The optional craft-fonts build input (Japanese fonts), so the Japanese font tests run on
      # Linux; Windows tests the build without it.
      - name: Check out craft-fonts (Linux)
        if: runner.os == 'Linux'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts

      - name: Install Linux system dependencies (egui/winit/rfd)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1

      # Registry downloads only: the build itself is cached whole below. Only main saves caches;
      # PRs restore main's. A save per PR branch (usable by that branch only) fills the repo's
      # 10 GB cache budget and evicts main's.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The whole target directory from main's latest run, workspace crates and test binaries
      # included, so a PR rebuilds only what its changes reach. Cargo decides freshness of
      # workspace files by mtime, and a fresh checkout makes every file new: the next step dates
      # the checkout back, then re-touches every file that differs from the commit the cached
      # build was made from (recorded in target/.ci-build-sha), so exactly those rebuild.
      - name: Restore the build from main
        uses: actions/cache/restore@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ github.sha }}
          restore-keys: target-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      # craft-fonts is pinned in this workflow, so it is dated back with the checkout unless this
      # file changed (its fonts are build inputs of pdfcraft-fonts, which most crates depend on).
      - name: Mark files changed since the cached build
        run: |
          base=$(cat target/.ci-build-sha 2>/dev/null) || exit 0
          # Without the base commit the checkout keeps its new mtimes and everything rebuilds.
          git fetch -q --depth=1 origin "$base" || exit 0
          changed=$(git diff --name-only "$base" HEAD) || exit 0
          git ls-files -z | xargs -0 touch -d '2000-01-01 00:00:00'
          if [ -d craft-fonts ] && ! printf '%s\n' "$changed" | grep -qx .github/workflows/ci.yml; then
            find craft-fonts -type f -exec touch -d '2000-01-01 00:00:00' {} +
          fi
          printf '%s\n' "$changed" | while IFS= read -r f; do
            if [ -e "$f" ]; then touch "$f"; fi
          done
          echo "Cached build from $base; $(printf '%s\n' "$changed" | grep -c .) files changed since"

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Build the isolated scripting kernel
        run: cargo xtask js-sandbox
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace

      # The OCR models (pinned by SHA-256 in ATTRIBUTION.toml; xtask verifies them), so the
      # model-backed OCR tests run on Linux. PDFCRAFT_MODELS_REQUIRED turns their skip-without-
      # models into a failure, so a passing run means they really executed.
      - name: Fetch the OCR models (Linux)
        if: runner.os == 'Linux'
        run: cargo xtask models

      - name: Test (with craft-fonts and OCR models)
        if: runner.os == 'Linux'
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          PDFCRAFT_MODELS_REQUIRED: "1"
        run: cargo test --workspace

      - name: Capture identity import and signing controls
        if: runner.os == 'Linux'
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          PDFCRAFT_MODELS_REQUIRED: "1"
          PDFCRAFT_SYSTEM_FONTS: "0"
          PDFCRAFT_IDENTITY_UI_SHOTS: ${{ github.workspace }}/target/identity-ui/${{ github.run_id }}-${{ github.run_attempt }}
        run: cargo test --locked -p pdfcraft-ui-egui --lib sign_ui::visual_tests::capture_identity_workflow -- --ignored --exact --nocapture

      - name: Upload identity UI diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-identity-ui-${{ runner.os }}-${{ runner.arch }}
          path: target/identity-ui/${{ github.run_id }}-${{ github.run_attempt }}/**/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Layering
        run: cargo xtask layers

      - name: Assets (licences and attribution)
        if: runner.os == 'Linux'
        run: cargo xtask assets

      - name: CLI without the MCP server still builds
        if: runner.os == 'Linux'
        run: cargo check -p pdfcraft-cli --no-default-features

      # Main saves its build for the next runs and deletes the one it replaced, so a single copy
      # (several GB) counts against the cache budget.
      - name: Record the build's commit
        if: github.ref == 'refs/heads/main' && !cancelled()
        run: |
          echo "$GITHUB_SHA" > target/.ci-build-sha
          du -sh target

      - name: Save the build
        if: github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ github.sha }}

      - name: Delete older saved builds
        if: github.ref == 'refs/heads/main' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "target-$RUNNER_OS-" --sort created_at --order desc \
            --limit 100 --json id,key --jq '.[1:][].id' |
            while read -r id; do gh cache delete --repo "$GITHUB_REPOSITORY" "$id"; done

  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check library crates for wasm32
        run: cargo xtask wasm

  deny:
    name: dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  fuzz:
    name: fuzz (mutation, 15 min)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
      - name: Fetch the pdf.js corpus (seeds)
        run: cargo xtask corpus
      - name: Build the isolated scripting kernel
        run: cargo xtask js-sandbox
      - name: Fuzz
        run: cargo xtask fuzz --time 900 --seed ${{ github.run_number }}
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz-out/findings
          if-no-files-found: ignore

  perf:
    name: performance and memory budgets (report only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf
      # Budgets in xtask/baselines/perf.json were measured on a different machine; shared CI
      # runners only record the numbers (docs/performance.md). Run without --report-only on a
      # quiet, known machine to gate.
      - name: Build the isolated scripting kernel
        run: cargo xtask js-sandbox
      - name: Measure
        run: cargo xtask perf --runs 3 --report-only
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: target/perf/perf-report.json
          if-no-files-found: ignore
