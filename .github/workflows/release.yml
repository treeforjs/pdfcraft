# Windows and Linux release packages with signed update checksums.
# Push to release, or dispatch that branch, to create a draft for review.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer push waits for the current upload to finish.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PDFCRAFT_BUILD_SHA: ${{ github.sha }}
  # The in-app updater's public key (a repository variable, not a secret), built into the app.
  CRAFT_UPDATE_PUBLIC_KEY: ${{ vars.CRAFT_UPDATE_PUBLIC_KEY }}
  INPUT_VERSION: ${{ inputs.version }}

jobs:
  version:
    name: Version and update signing checks
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate update public key
        run: |
          set -euo pipefail
          if [ -z "$CRAFT_UPDATE_PUBLIC_KEY" ]; then
            echo "::error::Set repository variable CRAFT_UPDATE_PUBLIC_KEY to the base64 DER Ed25519 public key."
            exit 1
          fi
          public="$(mktemp -d)"
          trap 'rm -rf "$public"' EXIT
          printf '%s' "$CRAFT_UPDATE_PUBLIC_KEY" | base64 --decode >"$public/input"
          if [ "$(base64 -w0 "$public/input")" != "$CRAFT_UPDATE_PUBLIC_KEY" ]; then
            echo "::error::CRAFT_UPDATE_PUBLIC_KEY must be single-line base64."
            exit 1
          fi
          case "$(wc -c <"$public/input")" in
            32)
              printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00' >"$public/key.der"
              cat "$public/input" >>"$public/key.der"
              ;;
            44) cp "$public/input" "$public/key.der" ;;
            *) echo "::error::CRAFT_UPDATE_PUBLIC_KEY must contain a raw 32-byte or DER Ed25519 public key."; exit 1 ;;
          esac
          if [ "$(head -c 12 "$public/key.der" | od -An -tx1 | tr -d ' \n')" != 302a300506032b6570032100 ]; then
            echo "::error::CRAFT_UPDATE_PUBLIC_KEY must be an Ed25519 public key."
            exit 1
          fi
          openssl pkey -pubin -inform DER -in "$public/key.der" -noout
      - name: Validate update private key before building
        if: github.ref == 'refs/heads/release'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Set UPDATE_SIGNING_KEY in the release environment to the full Ed25519 private-key PEM."
            exit 1
          fi
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" >"$key_dir/private.pem"
          openssl pkey -passin pass: -in "$key_dir/private.pem" -check -noout
          openssl pkey -passin pass: -in "$key_dir/private.pem" -pubout -outform DER >"$key_dir/public.der"
          if [ "$(wc -c <"$key_dir/public.der")" -ne 44 ] ||
             [ "$(head -c 12 "$key_dir/public.der" | od -An -tx1 | tr -d ' \n')" != 302a300506032b6570032100 ]; then
            echo "::error::UPDATE_SIGNING_KEY must be an Ed25519 private key."
            exit 1
          fi
          if [ "$(base64 -w0 "$key_dir/public.der")" != "$CRAFT_UPDATE_PUBLIC_KEY" ] &&
             [ "$(tail -c 32 "$key_dir/public.der" | base64 -w0)" != "$CRAFT_UPDATE_PUBLIC_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY does not match CRAFT_UPDATE_PUBLIC_KEY."
            exit 1
          fi
      - id: v
        name: Resolve version
        run: |
          . packaging/env.sh
          v="${INPUT_VERSION#v}"
          v="${v:-$VERSION}"
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$v"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "prerelease=$pre"
          } >>"$GITHUB_OUTPUT"
          echo "### PdfCraft v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
          # Windows on ARM (#61): cross-compiled on the x64 runner, so signing and WiX run as above.
          # .github/workflows/windows-arm64.yml installs and runs it on ARM64 hardware.
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      # The craft-fonts build input (Japanese fonts): every release embeds it. Bump deliberately.
      - name: Check out craft-fonts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        shell: bash
        run: cargo xtask version set "$PDFCRAFT_VERSION"
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build the isolated scripting kernel
        run: cargo xtask js-sandbox
      - name: Build, sign, package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    # The oldest GitHub-hosted image, so the binaries only need glibc >= 2.35 (Ubuntu 22.04+,
    # Debian 12+, Fedora 36+, RHEL 10). See docs/releasing.md.
    runs-on: ${{ matrix.runner }}
    # No `environment: release`: this job signs nothing, so it gets no release secrets.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NFPM_VERSION: 2.47.0
    steps:
      - uses: actions/checkout@v4
      # The craft-fonts build input (Japanese fonts): every release embeds it. Bump deliberately.
      - name: Check out craft-fonts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            desktop-file-utils appstream zsync
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${{ matrix.deb }}.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$PDFCRAFT_VERSION"
      - name: Build the isolated scripting kernel
        run: cargo xtask js-sandbox
      - name: Build and package (AppImage, deb, rpm, tar.gz, CLI tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh
      - name: Verify the production Wayland frame feature
        if: matrix.arch == 'x86_64'
        run: |
          mkdir -p target/window-frame
          cargo tree --locked --edges normal,features --target x86_64-unknown-linux-gnu -p pdfcraft -i winit >target/window-frame/features.txt
          grep -F 'winit feature "wayland-csd-adwaita"' target/window-frame/features.txt
      - name: Install Wayland frame-check tools
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends weston xvfb scrot libegl1-mesa libgl1-mesa-dri fonts-cantarell
      - name: Check the native Wayland window frame
        if: matrix.arch == 'x86_64'
        run: bash packaging/linux/check-window-frame.sh target/release/pdfcraft target/window-frame
      - name: Upload window-frame diagnostics
        if: always() && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-wayland-frame-x86_64
          path: target/window-frame/
          if-no-files-found: warn
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/pdfcraft$|metainfo|applications'
          # The OCR models (#103), where the installed app looks: <bin>/../share/pdfcraft/models.
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/share/pdfcraft/models/.+\.rten$'
          # Named exactly: dist/release also holds the CLI-only tar.gz, and `tar -tzf a b` reads b as a member.
          tar -tzf "dist/release/pdfcraft-$PDFCRAFT_VERSION-linux-${{ matrix.arch }}.tar.gz" | grep -E '/share/pdfcraft/models/.+\.rten$'
          ldd target/release/pdfcraft
          # The CLI-only archive: the binary and its licences, and it runs.
          cli="dist/release/pdfcraft-cli-$PDFCRAFT_VERSION-linux-${{ matrix.arch }}.tar.gz"
          tar -tzf "$cli" | grep -E '/pdfcraft-cli$'
          tar -tzf "$cli" | grep -E '/LICENSE-APACHE$'
          mkdir -p "$RUNNER_TEMP/cli" && tar -xzf "$cli" -C "$RUNNER_TEMP/cli"
          "$RUNNER_TEMP/cli/pdfcraft-cli-$PDFCRAFT_VERSION-linux-${{ matrix.arch }}/pdfcraft-cli" --version
          for appimage in dist/release/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
            # Update information is embedded, and the .zsync for delta updates sits beside it.
            "$appimage" --appimage-updateinformation | grep -F 'gh-releases-zsync|'
            test -s "$appimage.zsync"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    if: github.ref == 'refs/heads/release'
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Check required packages and write checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          for arch in x64 x86 arm64; do
            test -s "pdfcraft-$VERSION-windows-$arch.msi"
            test -s "pdfcraft-$VERSION-windows-$arch-portable.zip"
          done
          for arch in x86_64 aarch64; do
            for format in AppImage AppImage.zsync deb rpm tar.gz; do
              test -s "pdfcraft-$VERSION-linux-$arch.$format"
            done
            test -s "pdfcraft-cli-$VERSION-linux-$arch.tar.gz"
          done
          sha256sum -- * >SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
      - name: Sign and verify the update checksums
        id: sign_checksums
        working-directory: artifacts
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_KEY" ] || [ -z "$CRAFT_UPDATE_PUBLIC_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY and CRAFT_UPDATE_PUBLIC_KEY are required."
            exit 1
          fi
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" >"$key_dir/private.pem"
          printf '%s' "$CRAFT_UPDATE_PUBLIC_KEY" | base64 --decode >"$key_dir/public.input"
          case "$(wc -c <"$key_dir/public.input")" in
            32)
              printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00' >"$key_dir/public.der"
              cat "$key_dir/public.input" >>"$key_dir/public.der"
              ;;
            44) cp "$key_dir/public.input" "$key_dir/public.der" ;;
            *) echo "::error::Invalid Ed25519 public key length."; exit 1 ;;
          esac
          if [ "$(head -c 12 "$key_dir/public.der" | od -An -tx1 | tr -d ' \n')" != 302a300506032b6570032100 ]; then
            echo "::error::Expected an Ed25519 public key."
            exit 1
          fi
          openssl pkey -passin pass: -in "$key_dir/private.pem" -pubout -outform DER >"$key_dir/derived.der"
          cmp "$key_dir/public.der" "$key_dir/derived.der"
          openssl pkeyutl -sign -passin pass: -inkey "$key_dir/private.pem" -rawin -in SHA256SUMS.txt -out "$key_dir/signature"
          test "$(wc -c <"$key_dir/signature")" -eq 64
          openssl pkeyutl -verify -pubin -keyform DER -inkey "$key_dir/public.der" -rawin -in SHA256SUMS.txt -sigfile "$key_dir/signature"
          base64 -w0 "$key_dir/signature" >SHA256SUMS.txt.sig
          test -s SHA256SUMS.txt.sig
      - name: Preserve verified update checksums
        if: always() && steps.sign_checksums.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: signed-checksums-pdfcraft-${{ needs.version.outputs.version }}-${{ github.sha }}
          path: |
            artifacts/SHA256SUMS.txt
            artifacts/SHA256SUMS.txt.sig
          if-no-files-found: error
          retention-days: 14
      - name: Create or update the draft release
        working-directory: artifacts
        run: |
          tag="v$VERSION"
          title="PdfCraft v$VERSION"
          set -euo pipefail
          pre=()
          if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
          notes="$RUNNER_TEMP/release-notes.md"
          cat >"$notes" <<'EOF'
          Windows and Linux packages for PdfCraft.

          Standard minimize, maximize/restore and close controls are available on Linux Wayland, with the system window frame on Windows and X11.

          Includes bounded redaction overlays, checked automation page indices, private recovery and digital-ID writes, retryable autosaves, and the current shared updater. Desktop integration uses the current application ID with compatibility entries for previous native installs.

          Craftworks installs the Windows portable ZIP or Linux AppImage after verifying the signed SHA-256 checksums. Other packages are available for manual installation.

          Download the package for your operating system and architecture. Keep SHA256SUMS.txt and SHA256SUMS.txt.sig with the release assets.
          EOF
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $tag is already published. Bump the version (cargo xtask version set) before pushing to release."
              exit 1
            fi
            echo "Updating draft $tag: replacing its assets"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --prerelease="$PRERELEASE" --notes-file "$notes"
            gh release upload "$tag" --clobber -- *
          else
            echo "Creating draft $tag"
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --notes-file "$notes" "${pre[@]}" -- *
          fi
          {
            echo "Draft release **$title** at \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
