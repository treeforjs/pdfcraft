notes = "ISO 32000-2 §14.7.4, headless: /Namespaces and /NS read and written, namespace dictionaries (/NS URI, /Schema, /RoleMapNS), the PDF 1.7 (default), PDF 2.0 and MathML namespaces, and role mapping across namespaces (bounded, cycle-checked; missing or non-indirect namespaces reported). One resolver feeds the Tags listing, the full check, the PDF/UA checker, reading order / accessible text, figures and bookmarks from structure. tags_add_namespace adds a namespace or changes its schema and mappings; tags_set namespace moves an element (each one undo step). PDF/UA-2: PDF 2.0 types must be in the PDF 2.0 namespace, other namespaces must map to it or MathML, used namespaces must be listed. Not yet: a Tags panel namespace view (UI redesign), raising the file version to 2.0, embedding schema files, checking other mappings that depended on one removed."

