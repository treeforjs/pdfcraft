notes = "Word-level Myers diff with patience anchors for long files (≈32 MB worst-case per diff segment); a page map (same/modified/moved/inserted/deleted pages, text fingerprints, picture fingerprints for textless pages) so moved pages are diffed against their counterpart; replaced/inserted/deleted shaded on the new file, listed in the Compare panel, or added as comments. The Compare panel shows the page map (old page → new page with status; a row goes to that page) next to the changes; each page's text is read once per run, on a worker thread with progress and Stop."

