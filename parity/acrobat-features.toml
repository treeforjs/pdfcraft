notes = "headless only (no UI yet): page_objects selects paths (and every other page object); objects_style changes a path's fill and stroke (none turns either off, a colour turns it on: #RRGGBB, gray/RGB/CMYK components, or components in the colour space the path already paints with, checked for count and range; patterns refused), line width and dash (displayed points, divided by the path's CTM scale), cap, join and opacity (a new ExtGState with CA/ca in the page's own resources); objects_resize scales objects about an anchor of their displayed box (width/height in proportion, or scale factors); objects_delete removes objects keeping the clip/text state they leave; objects_transform moves, rotates and flips. Each path is wrapped in q … Q with the new state, everything else byte for byte; one undo step each, keep-tags-on-edit keeps MCIDs (deleted content leaves the tree). UI and free-angle rotation: the Edit object tool (edit.edit-object-tool). Missing: editing anchor points and path geometry, miter limit and separate fill/stroke opacity, blend modes, choosing an ICC or spot colour space for the new colour, paths inside Form XObjects, added items and page marks (own tools), text and images take only opacity from objects_style"

