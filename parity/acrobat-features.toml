evidence = ["crates/ui-egui/tests/ui.rs::drag_selects_text_and_copy_returns_it", "crates/ui-egui/tests/ui.rs::selection_works_in_every_view_rotation", "crates/ui-egui/tests/text_select.rs::quick_clicks_select_a_word_then_the_line_then_the_page", "crates/ui-egui/tests/text_select.rs::quick_clicks_with_the_highlighter_mark_only_the_word", "crates/ui-egui/tests/text_select.rs::shift_click_extends_the_selection_from_its_anchor", "crates/ui-egui/tests/text_select.rs::dragging_across_blank_pages_works_both_directions_and_in_every_rotation", "crates/ui-egui/tests/text_select.rs::shift_click_extends_to_another_page_and_keeps_the_original_anchor", "crates/ui-egui/tests/text_select.rs::paragraph_context_action_selects_wrapped_lines_without_the_next_paragraph", "crates/ui-egui/tests/text_select.rs::four_clicks_select_page_in_single_layout_and_document_in_continuous_layout", "crates/ui-egui/tests/text_select.rs::dragging_a_comment_does_not_extend_an_existing_reader_selection", "crates/engine/src/reader_selection/tests.rs::reverse_ranges_keep_page_line_and_blank_page_boundaries", "crates/engine/src/reader_selection/tests.rs::paragraph_stops_at_spacing_and_columns_in_reading_order", "crates/automation/tests/reader_selection.rs::reader_range_paragraph_and_all_are_read_only_and_validate_every_endpoint"]
notes = "Drag to select; ⇧-click extends the selection to the click, keeping its anchor, on the same or another page (blank pages kept as boundaries; reverse drags keep the anchor; a text-owned drag scrolls at the viewport edge). With the Select tool, quick clicks select a word (two), the line (three), and with four the page (Single Page) or the document (continuous/two-page). The context menu's Select paragraph uses conservative geometric grouping. Headless: text_selection (range/paragraph/all, one-based inclusive glyph endpoints from text_extract include_glyphs). The markup and Redact tools mark a double-clicked word and stop there. Missing: reading order is the geometric extractor (a side column at the same height interleaves with the main column), no tagged-structure/bidi/semantic paragraph reconstruction; installed-desktop (X11/Wayland) pointer acceptance not yet recorded."

[[feature]]
id = "view.copy-text"
title = "Copy selected text"
area = "B"
tier = "P0"
milestone = "M3"
status = "shipped"
commands = []
tools = ["text_selection"]
evidence = ["crates/ui-egui/tests/ui.rs::drag_selects_text_and_copy_returns_it", "crates/ui-egui/tests/text_select.rs::select_all_and_immediate_copy_wait_for_offscreen_text_without_partial_output", "crates/ui-egui/tests/text_select.rs::escape_cancels_queued_copy_before_any_offscreen_text_is_returned", "crates/ui-egui/tests/text_select.rs::restricted_reader_copy_does_not_write_clipboard_and_explains_permission", "crates/automation/tests/reader_selection.rs::restricted_copy_and_legacy_extract_refuse_but_owner_can_copy", "crates/automation/tests/reader_selection.rs::encrypted_copy_denied_refuses_every_reader_path_without_leaking_text", "crates/engine/src/reader_selection/tests.rs::copy_permission_is_enforced_for_user_and_lifted_for_owner", "crates/automation/tests/reader_selection.rs::copy_denied_text_paths_withhold_or_refuse_and_owner_lifts", "crates/automation/tests/reader_selection.rs::mcp_text_resources_refuse_copy_denied_documents_and_owner_lifts", "crates/engine/src/reader_selection/tests.rs::export_text_images_and_office_refuse_copy_denied_documents_and_owner_lifts", "crates/engine/src/reader_selection/tests.rs::compare_refuses_when_either_document_denies_copying", "crates/engine/src/reader_selection/tests.rs::encrypted_documents_without_an_editor_fail_closed", "apps/pdfcraft-cli/tests/text.rs::text_fails_closed_when_encryption_permissions_cannot_be_verified"]
notes = "Copy waits for every selected page's text and never copies a partial result; Escape/Cancel, a replacement selection, document changes, tab switch, modal/palette, focus loss or a focused text editor cancel a pending copy. Copy permission (ISO 32000-2 Table 22 bit 5) is enforced in the reader, text_selection, text_extract, MCP text resources and pdfcraft-cli text, refuses text/Word/HTML/RTF export, Export all images and Compare, and withholds page text (locations only, text_withheld) from text_find, text_lines, text_paragraphs, content_list and the text_edit echo; the permissions password lifts it. Encrypted documents whose permissions cannot be established (no editor; the CLI on a file the engine rejects, e.g. /P edited without /Perms) fail closed. OCR copy enforcement is in the OCR lane, not yet integrated here; field detection names and the Edit Text panel still show page text on copy-denied files that allow changes. Limits: 32 MiB per copy, progressive 2M-glyph/32 MiB selection cache. Missing: OS clipboard acceptance on installed X11/Wayland desktops (control-channel ui.key does not synthesize Event::Copy)."

