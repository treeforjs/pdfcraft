notes = "Edit a PDF ▸ Edit objects (QuickTool edit-object) selects any object the page's own content draws: text objects, images, inline images, vector paths, shadings (their box is the clip they fill) and Form XObjects (as a whole), and tagged content by MCID. Click (⇧-click toggles), marquee from an empty spot, ⌘A for the page; boxes and eight handles plus a rotation handle; drag to move, corners scale in proportion (⇧ frees), edges stretch, the round handle turns by any angle (⇧ snaps to 15°); Delete, arrows nudge 1 pt (⇧ 10), ⌘]/⌘[ forward/backward (⇧: front/back), right-click Arrange/Rotate/Flip/Delete; the Edit panel shows kind and size, arrange and turn buttons, fill and stroke swatches (none or a colour), line width and opacity (opacity on any object: q /gs … Q). Every change is one Edit::EditPageObjects undo step through the existing objects rewriter, untouched objects keep their bytes; several objects scale or turn together about their combined box (ObjectsEdit::Matrix). Hit testing uses ObjectIndex, a 32×32 grid built once per page and edit generation for the page under the pointer or holding the selection (objects covering more than 16 cells go on a short list), never per frame. Headless: objects_select (point/marquee in view points), page_objects reports appearance (fill/stroke/line width/opacities) and opacity, objects_transform takes degrees and a view-space matrix. Missing: hit testing by box, not exact path geometry; moving a shading painted with sh shifts its gradient within its clip; Form XObjects can't be entered to edit what they contain; added items and page marks keep their own tools; colour choice is a swatch row (no full picker, no spot/ICC space); no anchor-point editing, snapping or smart guides"

