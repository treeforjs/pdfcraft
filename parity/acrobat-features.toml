evidence = ["crates/automation/tests/color_settings.rs::the_defaults_and_built_in_profiles_are_listed", "crates/automation/tests/color_settings.rs::working_spaces_and_the_untagged_policy_change_how_device_colour_renders", "crates/automation/tests/color_settings.rs::a_loaded_cmyk_profile_drives_rendering_separations_and_black_point_compensation", "crates/automation/tests/color_settings.rs::an_output_intent_overrides_the_working_space_unless_the_policy_says_otherwise", "crates/automation/tests/color_settings.rs::convert_colors_and_pdfx_take_their_defaults_from_the_settings", "crates/automation/tests/color_settings.rs::bad_settings_and_profiles_are_refused", "crates/engine/src/color_settings.rs::built_in_profiles_display_and_the_defaults_are_valid", "crates/engine/src/color_settings.rs::default_settings_render_as_the_built_in_conversions", "crates/engine/src/color_settings.rs::profile_names_are_checked", "crates/render/src/colour.rs::default_spec_matches_the_renderers_own_conversion", "crates/render/src/colour.rs::naive_cmyk_and_black_point_compensation_change_the_colours", "crates/render/src/colour.rs::unusable_profiles_are_refused_without_panicking", "crates/preflight/src/icc.rs::built_profiles_are_well_formed_and_srgb_colorants_match"]
notes = "Headless only (the Preferences ▸ Color Management panel waits for the UI redesign). color_settings_get/color_settings_set read and change the session settings: RGB, CMYK and gray working spaces, rendering intent, black point compensation and the policy for untagged colour (output_intent, the default: a document's output intent profile replaces the working space of its family, Acrobat's Output Intent Overrides Working Spaces; working_space; unmanaged: gray/RGB as sRGB numbers, CMYK naively, separations through the built-in conversion); with doc they say per family what the document's untagged colour is read in and how RGB/Lab separate. color_profiles_list lists built-in profiles written in code from published colorimetry (srgb, display-p3, a98-rgb, romm-rgb; sgray, gray-gamma-2.2/1.8, dot-gain-15/20 on PdfCraft's own parabolic model; cgats001, the renderer's CC0 CMYK profile) and color_profile_load loads gray/RGB/CMYK ICC profiles from files under --root (refused when no table converts their colours). Effects: page_render/render_preview convert DeviceGray, DeviceRGB and DeviceCMYK through the resolved profiles with the intent and BPC and ICC-based colour with the intent and BPC (vendored hayro-interpret patch 25); separations, total area coverage, overprint preview, the object inspector and Ink Manager conversions separate RGB/Lab through the output intent's or the working CMYK profile (when it has BToA tables) with the intent, and overprint preview composites through the same display conversion; print_convert_colors takes the settings' intent and converts Device destinations through a non-factory working space (use_working_space); pdfx_convert uses a non-factory working CMYK output (prtr) profile as the output intent when the document has none. The factory settings render untagged colour exactly as before (ICC-based colour now uses their relative colorimetric intent, the PDF default, where the profile has that table; it used perceptual). Missing: the UI, persistence across sessions and Acrobat's named presets, a colour engine choice, black point compensation done in PCS (it scales the converted sRGB in linear light, and has no effect on profiles whose darkest colour is already black, such as cgats001), a built-in CMYK profile with BToA tables (separating with the factory settings still uses the built-in approximation), DeviceRGB/DeviceGray read in their working spaces when separating or converting colours (they are read as sRGB there), the intent in Convert to PDF/X (relative colorimetric), per-object rendering intents (ri, /Intent) in rendering, and a comparison against Acrobat's colours."

