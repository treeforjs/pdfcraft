id = "a11y.autotag-fields"
title = "Autotag form fields"
area = "M"
tier = "P1"
milestone = "M12"
status = "partial"
commands = []
tools = ["tags_autotag"]
evidence = ["crates/engine/tests/autotag.rs::form_fields_become_form_elements_next_to_their_labels", "crates/engine/tests/autotag.rs::fill_writes_suggested_tooltips", "crates/engine/tests/autotag.rs::form_tags_survive_undo_redo_save_and_reload", "crates/engine/tests/autotag.rs::fields_in_two_columns_read_down_each_column", "crates/engine/tests/autotag.rs::a_field_labelled_by_a_heading_goes_after_it", "crates/engine/tests/autotag.rs::hostile_field_trees_never_panic", "crates/engine/tests/autotag.rs::thousands_of_widgets_are_tagged_within_bounds", "crates/a11y/src/autotag_tests.rs::field_labels_and_names_become_tooltips", "crates/automation/tests/automation.rs::tags_autotag_tags_form_fields_and_fills_tooltips"]
notes = "headless only (tags_autotag detect_fields, default true; field_tooltips report|fill): every widget (radio and checkbox kids included) becomes a Form element with an OBJR, a StructParent and a ParentTree entry, placed in reading order next to its label (inside the P/LBody/TD holding a label on its left or above, before a checkbox/radio label on its right, after a heading label; unlabelled widgets ordered by position with the blocks); Alt from TU, else T, else the label (radio buttons add their option); fields without TU reported with a suggestion from the label (else the humanized name), written as TU with fill. Field tree walked up through /Parent with a seen-set and depth limit, never down /Kids; 50 000 widgets at most. Not yet: no UI; labels inside the same text run as a drawn blank (\"Name: ____\" in one Tj) are not split; a widget inside a table goes with its label's cell rather than its own; no PrintField attributes for non-interactive fields; no comparison with Acrobat's output on real forms"

