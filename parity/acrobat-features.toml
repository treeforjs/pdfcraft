[[feature]]
id = "edit.text-edit"
title = "Edit existing text in place"
area = "C"
tier = "P0"
milestone = "M7"
status = "partial"
commands = ["edit.edit_text"]
tools = ["text_lines", "text_paragraphs", "text_edit"]
evidence = ["crates/edit/src/tests.rs::paragraphs_are_found_and_rewrapped", "crates/edit/src/tests.rs::text_lines_are_found_and_replaced_in_place", "crates/ui-egui/tests/editing.rs::editing_existing_text_in_place", "crates/automation/tests/automation.rs::editing_existing_text_through_tools", "crates/edit/src/tests.rs::a_line_whose_operator_starts_the_next_stream_can_be_edited", "crates/automation/tests/automation.rs::a_line_split_across_content_streams_is_listed_and_edited", "crates/edit/src/tests.rs::mixed_paragraph_selection_keeps_surrounding_faces_and_reopens", "crates/automation/tests/automation.rs::selected_character_runs_keep_surroundings_through_reflow_history_and_save", "crates/ui-egui/tests/editing.rs::selected_characters_keep_the_rest_of_the_paragraph_style", "crates/edit/src/tests.rs::whole_paragraph_edits_keep_untouched_codes_tj_kerning_and_repeated_spaces", "crates/edit/src/tests.rs::whole_paragraph_edits_keep_the_source_rows_they_do_not_reach", "crates/edit/src/tests.rs::whole_paragraph_edits_remove_only_exact_fake_bold_copies", "crates/automation/tests/automation.rs::whole_paragraph_text_edits_keep_untouched_words_codes_and_pixels_through_save", "crates/edit/src/tests.rs::turned_paragraph_edits_keep_untouched_glyphs_codes_kerning_and_gaps", "crates/edit/src/tests.rs::turned_paragraphs_group_rows_and_keep_the_rows_an_edit_does_not_reach", "crates/edit/src/tests.rs::turned_selections_recolor_and_underline_in_the_text_frame", "crates/automation/tests/automation.rs::turned_paragraph_edits_keep_every_pixel_outside_the_changed_word"]
notes = "Whole-paragraph replacement and selected-range or mixed-run edits of upright paragraphs share one run-preserving path: untouched characters keep their source codes, supported text state and TJ adjustments (written back as TJ numbers), typed repeated spaces are kept, and source rows the edit does not reach keep their line breaks (a Poppler pdftotext -bbox check of a synthetic kerned paragraph showed every untouched word in place and pixels identical outside the edited word). Exact fake-bold copies are removed only for whole edits of uniform undecorated paragraphs; independent overlapping text is kept. Paragraphs turned by any angle (through Tm, the CTM or both, with separate horizontal and vertical scales along the text axes) use the same run path: lines are grouped, spaced and measured in a local text frame (the inverse of the normalized text axes), so whole and range edits, reflow, rises and underlines keep untouched glyphs in place (synthetic 90/180/270/30/-45 degree fixtures; a Poppler pdftotext -bbox and pdftoppm check of 90, 180 and 30 degree fixtures found untouched words and every pixel outside the edited word unchanged, although Poppler fragments 30 degree words differently after the edit). Skewed or reflected paragraphs still refuse range edits and use the legacy whitespace-normalizing re-encoding for whole edits; the visual editor still shows a turned paragraph's axis-aligned box. Character-range font/size/colour/weight/slant changes are available through the Format panel and text_edit; exact PDF draft preview is nonmutating. Unicode scalar ranges are end-exclusive; splitting an indivisible source glyph refuses. Undo/redo and save/reopen are exercised. Still partial: arbitrary paragraph layouts/stream boundaries, skewed or reflected text, broader fonts/shaping, decoration and structure/tag preservation."

