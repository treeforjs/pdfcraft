evidence = ["xtask/src/perf.rs::budgets_cover_every_scenario_with_positive_limits", "xtask/src/perf.rs::generated_documents_are_valid_deterministic_and_carry_the_phrase_once", "xtask/src/perf.rs::probe_reports_flatten_into_named_samples"]
notes = "Harness only: `cargo xtask perf` (docs/performance.md) measures open, first/last page render, all-text extraction, find, incremental/full save and peak RSS through the automation tools, and UI open, time to first page, scroll frame times and navigation through kittest, on four synthetic documents (500 and 5 000 text pages, 24 image pages, a 110 000-path page), and gates medians against xtask/baselines/perf.json. Budgets are dev-profile numbers from one shared, heavily loaded WSL2 Linux machine (2026-10-12); the cited tests check the harness, not the budgets. Not measured: release builds, Windows, macOS, web, multi-GB files. Known defects it found: Comments panel per-frame cost linear in comment count (~200 ms frames at 5 000 comments) and an unbounded automation text cache (~873 MiB after extracting 5 000 pages; bounded on 2026-10-12 to a 96 MiB geometry cache plus a 32 MiB geometry-free search index: text-5000 probe peak RSS 989 -> 484 MiB and find 167 -> 49 ms in one dev run)."

