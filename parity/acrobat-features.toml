notes = "Headless only: print_separations_list lists the four process inks and every Separation/DeviceN spot colorant (page resources, forms, images, patterns and shadings) with its alternate space, tint transform type, the alternate's value at 100% tint (Type 2 and one-input Type 0 into gray/RGB/CMYK), a preview colour and the pages where it is painted and declared; print_separations_render gives one grayscale plate per ink (film polarity) or an RGB composite of only the shown inks (Output Preview's show/hide), in display orientation; print_separations_sample reads every ink's percentage at a point; print_total_area_coverage reports the max TAC and where it is, checked against a limit. Plates come from PdfCraft's own bounded ink rasterizer (the renderer is RGB-only) on a grid (default 72 cells/inch, lowered so all plates fit 32M cells, at most 64 inks), simulating overprint (OP/op/OPM 1 nonzero rule; off with overprint false). CMYK, Gray, Separation (process names map to process plates, All to every plate, None to nothing), DeviceN and Indexed are exact; RGB/Lab convert through the output intent's CMYK ICC profile (relative colorimetric, lut BToA) when usable, else the Convert Colors built-in approximation, and every result says which. Missing: the Output Preview panel and cursor readout in the UI, anti-aliased/exact geometry (cell centres, clip bounding boxes, text as string boxes), transparency (painted opaque, counted), patterns, shadings, DCT/JPX/JBIG2/CCITT images and annotations (unmeasured), previews for DeviceN-only colorants and Type 3/4 tint transforms, ink manager aliasing, and comparison against Acrobat's numbers."

