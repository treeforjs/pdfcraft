ay through the renderer's built-in CMYK profile, not the press profile), simulation of what the ink rasterizer can't see (patterns, shadings, DCT/JPX/JBIG2/CCITT images, annotations, transparency painted opaque, clip bounding boxes, text string boxes from font Widths, so standard-14 fonts without Widths are measured with a fallback width), edges up to half a grid cell off where cell centres decide coverage, per-object rather than per-box appearance changes, and a comparison against Acrobat's rendering."

