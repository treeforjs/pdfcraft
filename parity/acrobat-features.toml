id = "ocr.ocr-engines"
title = "Pluggable OCR engines (ocrs default; tesseract optional)"
area = "I"
tier = "P1"
milestone = "M10"
status = "partial"
commands = ["ocr.recognize"]
tools = ["ocr_engines_list", "ocr_engine_set", "ocr_recognize", "ocr_prepare", "ocr_recognize_files"]
evidence = ["crates/ocr/src/engines.rs::engines_register_replace_and_reject_bad_ids", "crates/ocr/src/engines.rs::the_default_registry_has_the_built_in_engine_first_and_tesseract", "crates/ocr/src/tesseract.rs::tsv_words_become_lines_with_boxes_and_confidence", "crates/ocr/src/tesseract.rs::malformed_rows_are_left_out", "crates/ocr/src/tesseract.rs::huge_output_is_refused_or_bounded", "crates/ocr/src/tesseract.rs::a_missing_program_is_unavailable", "crates/ocr/src/tesseract.rs::a_stand_in_program_is_probed_fed_and_read", "crates/ocr/src/tesseract.rs::a_hanging_program_is_stopped", "crates/ocr/src/tesseract.rs::endless_output_is_capped", "crates/engine/tests/ocr_engines.rs::the_selected_engine_reads_every_recognition", "crates/engine/tests/ocr_engines.rs::a_job_can_name_another_engine_and_bad_choices_fail_before_reading", "crates/engine/tests/ocr_engines.rs::an_engine_that_cannot_run_fails_the_job_before_any_page", "crates/automation/tests/ocr_engines.rs::ocr_engine_tools_list_choose_and_read_with_the_engine"]
notes = "pdfcraft_ocr::engines: an OcrEngine trait (id, name, info: available/version/languages/external/detail, prepare, recognize) and a Registry; the built-in ocrs engine is the default. Session holds the registry and the selected engine (set_ocr_engine, register_ocr_engine, set_tesseract_path); OcrSettings::engine overrides it per job, and every entry point resolves its engine through Session::ocr_engine_for (recognize_text and the actions/accessibility paths, review drafts, editable output, camera-then-recognize, batch files, the Recognize Text dialog's worker). Tools: ocr_engines_list, ocr_engine_set, and an engine argument on ocr_recognize/ocr_prepare/ocr_recognize_files. Optional Tesseract engine (crates/ocr/src/tesseract.rs) runs an installed tesseract program, never linked or shipped: found at a configured path, $PDFCRAFT_TESSERACT or on PATH; the page goes in on stdin as binary PGM/PPM, TSV comes out (words, boxes, 0-1 confidence; ligatures spelled out; rows that are malformed, outside the image, too long or not WinAnsi-encodable are dropped); 120 s per image and 10 s probe limits, 32 MiB output cap, 64 KiB stderr cap, bounded page word/text counts; languages are the installed trained data among 13 Latin-script languages (en de fr es it pt nl da sv no fi is ca); reported unavailable when not installed and always on wasm (no process spawning there). Tests use a fake registered engine and a stand-in shell program with Tesseract's command line (unix), not Tesseract itself. Not yet: no real Tesseract run was executed here (reads_rendered_text_when_installed skips without it); no engine picker in the Recognize Text dialog; the selection is per session, not a saved preference; the program path is not settable from automation tools (only by environment or the Session API) so agents can't make PdfCraft run arbitrary executables; hOCR output, page segmentation and dpi hints are not passed; non-Latin languages remain blocked by the WinAnsi searchable-text font."

