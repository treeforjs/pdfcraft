[[feature]]
id = "ocr.editable-text-output"
title = "Editable text and images output"
area = "I"
tier = "P1"
milestone = "M10"
status = "partial"
commands = []
tools = ["ocr_recognize", "ocr_prepare", "ocr_apply", "ocr_recognize_files"]
evidence = ["crates/ocr/src/editable.rs::words_are_grouped_into_lines_in_reading_order_and_split_at_column_gaps", "crates/ocr/src/editable.rs::stroke_contrast_tells_serif_from_sans", "crates/ocr/src/editable.rs::suspects_are_low_confidence_implausible_unsupported_or_inkless", "crates/ocr/src/editable.rs::visible_lines_are_fitted_text_runs", "crates/ocr/src/editable.rs::hostile_words_and_images_do_not_panic", "crates/optimize/tests/inpaint.rs::gray_text_areas_are_filled_with_the_local_paper_and_the_rest_is_kept", "crates/optimize/tests/inpaint.rs::one_bit_images_keep_their_encoding_and_get_paper_bits", "crates/optimize/tests/inpaint.rs::hostile_regions_and_placements_are_refused_or_harmless", "crates/engine/tests/ocr_editable.rs::editable_output_replaces_text_with_matching_visible_text_and_cleans_the_scan", "crates/engine/tests/ocr_editable.rs::converted_lines_can_be_edited_like_normal_text", "crates/engine/tests/ocr_editable.rs::corrections_apply_to_visible_text_and_emptied_words_stay_as_image", "crates/engine/tests/ocr_editable.rs::bad_editable_settings_are_refused_before_rendering", "crates/engine/tests/ocr_editable.rs::hostile_recognition_results_and_layouts_do_not_panic_or_change_the_document", "crates/automation/tests/automation.rs::ocr_editable_output_is_validated_before_models_and_reports_lines"]
notes = "Recognize Text output editable (+ min_confidence 0-1, default 0.5): recognized words are grouped into lines (vertical overlap, split at column gaps); each line's baseline comes from its ink row profile (the bottom of the ink, or the end of the dense band when a recognized letter descends) and its size from the rise to the top of the ink over the candidate face's ascender/cap/x-height; the colour is the mean of the darkest half of the ink. A standard face (Helvetica, Times-Roman or Courier, regular or bold) is chosen by width fit of the words, stroke contrast (median horizontal over vertical ink run) and stem weight; the line is written as visible text (Tz fits the words' widths, TJ puts each word where it was read, Tc 0). The converted words are filled with the local paper colour in the page images (8-bit gray/RGB rewritten Flate or JPEG q90; one-bit Flate/CCITT kept one-bit); areas no image covers or that can't be rewritten are painted with paper colour. Words below min_confidence (with the bundled recognizer, which reports no confidence, words failing the dictionary-free word-shape test), words in lines without measurable ink and undrawable words stay as image with invisible text. One undoable Recognize text step; per page the line count, fonts, line styles and low-confidence words are reported. Measured only on synthetic 300 ppi fixtures with a stand-in recognizer (the real-model part of the automation test was not run here). Not yet: glyph-shape font matching or embedded/subset fonts (only the six standard faces), italic, non-Latin text, glyph side-bearing alignment (text starts at the ink box), tables/columns/reflow into paragraphs, colour beyond one flat colour per line, a dialog/UI option, real scans."

