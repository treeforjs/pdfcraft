notes = "Headless (optimize_flatten_transparency; engine Edit::FlattenTransparency, one undo step, none when nothing uses transparency). Transparency is found with the PDF/X verifier's criteria (soft masks, CA/ca < 1, non-Normal blend modes, transparency groups, image soft masks) in the resources the content uses, through forms, patterns and Type 3 fonts. Resources are replaced by opaque copies (shared objects copied, so other pages keep theirs), the page /Group is removed, and only the rectangles where the rendered look changed are rasterized from the original at the preset's resolution (low 150, medium 300, high 600 ppi, or 36–1200) and drawn as opaque RGB images over the kept vector content; everything outside them stays vector and text stays searchable. raster_vector_balance 0 or regions above balance % of the page rasterize the whole page (64 MP budget). Saved files pass the PDF/X-1a transparency rule; renders before/after match within resampling at patch edges. Missing: annotation appearances are not flattened, regions are rectangles (no clipping to object outlines, no Clip Complex Regions, no text/strokes to outlines), images are DeviceRGB (no CMYK for PDF/X-1a), optional content is rasterized as shown by default, no comparison with Acrobat's flattener output, no Flattener Preview or Optimizer Transparency panel (UI redesign)"

