tools = ["recovery_snapshot", "recovery_list", "recovery_restore", "recovery_discard"]
evidence = ["crates/ui-egui/tests/recovery.rs::a_closed_browser_tab_is_offered_and_recovered_like_a_crash", "crates/ui-egui/tests/recovery.rs::damaged_browser_entries_load_nothing_and_are_cleaned_up", "crates/ui-egui/tests/recovery.rs::bytes_that_fail_their_checksum_open_nothing", "crates/ui-egui/tests/recovery.rs::recovery_commands_reopen_the_prompt_and_save_copies_now", "crates/engine/src/recovery.rs::hostile_metadata_is_rejected_or_cleaned", "crates/engine/src/recovery.rs::truncated_or_corrupt_bytes_load_nothing", "crates/engine/src/recovery.rs::the_cap_refuses_entries_that_do_not_fit_and_counts_replacements_once", "crates/automation/tests/recovery.rs::damaged_entries_open_nothing_and_hostile_arguments_are_refused"]
notes = "The web app autosaves unsaved documents (Preferences autosave interval) into the browser's origin-private file system (web-sys, no JS) with the desktop's entry format and checks (pdfcraft_engine::recovery: validated keys and metadata, length + checksum, damaged entries load nothing and are removed), capped at 256 MiB; writes are queued off the frame, and a hidden or closing tab flushes changes. The Recovery prompt opens once stored entries have loaded; saving (download) or closing a document discards its copy. The browser glue (recovery_web.rs) compiles for wasm32 but is not exercised in a real browser here (no browser in CI): the shared logic is tested through a native stand-in for browser storage. Not yet: coordination between two PdfCraft tabs of the same origin (one tab can offer the other's live copies), and changes made after the last flush are lost when the tab closes before the async write completes."

