[[feature]]
id = "protect.attachment-trust"
title = "Block opening risky attachment types"
area = "G"
tier = "P1"
milestone = "M12"
status = "partial"
commands = []
tools = ["trust_attachments_get", "trust_attachments_set", "attachment_list", "attachment_open", "attachment_extract", "associated_file_extract"]
evidence = ["crates/engine/src/attachment_trust.rs::executables_and_scripts_are_blocked", "crates/engine/src/attachment_trust.rs::documents_are_allowed_and_unknown_types_prompt", "crates/engine/src/attachment_trust.rs::case_trailing_dots_and_spaces_are_normalized", "crates/engine/src/attachment_trust.rs::only_the_last_path_component_counts", "crates/engine/src/attachment_trust.rs::double_extensions_use_the_last_and_flag_disguises", "crates/engine/src/attachment_trust.rs::hidden_characters_are_seen_through", "crates/engine/src/attachment_trust.rs::stream_suffixes_take_the_stricter_reading", "crates/engine/src/attachment_trust.rs::user_lists_override_the_built_in_ones", "crates/engine/src/attachment_trust.rs::bad_user_lists_are_refused", "crates/engine/src/attachment_trust.rs::settings_round_trip_and_hostile_settings_are_tamed", "crates/engine/src/attachment_trust.rs::hostile_names_do_not_panic", "crates/automation/tests/automation.rs::attachment_trust_through_tools", "crates/ui-egui/tests/protect.rs::attachment_trust_is_saved_and_refuses_denied_types"]
notes = "Trust Manager's attachment allow/deny list as a policy on the engine Session (pdfcraft_engine::attachment_trust). Built-in deny list of types that run code when opened (Windows programs, installers, scripts and script hosts such as exe, bat, cmd, js, vbs, ps1, hta, scr, lnk, msi; macOS apps, packages and scripts; Unix shell scripts and packages; jar/py/pl/rb/php; disk images; macro-enabled Office files and Access databases), a built-in allow list of plain documents and images (pdf, fdf, txt, csv, json, xml, png, jpg, …), and the user's allow/deny lists on top (user deny wins, then user allow, then built-in deny, then built-in allow); anything else, or a name with no extension, prompts. Names are checked as a launcher sees them: last path component, case folded, trailing dots/spaces/control characters dropped, invisible and bidi-override characters removed (and flagged), an NTFS stream suffix (x.exe:stream) read both ways with the stricter winning; only the last extension decides, so report.pdf.exe is an .exe flagged disguised while notes.exe.pdf is a PDF. attachment_open refuses blocked types even with confirm, returns status prompt with a question for unknown types until confirm: true, opens an allowed PDF as a new document and writes other types to a path for launching (launched: false; nothing headless launches programs). attachment_extract and associated_file_extract always save to the chosen path and report risk/trust/warning. The desktop app's Attachments panel refuses to open a denied type, warns after saving a risky one, and persists the lists in its settings (restored leniently: bad entries skipped, 256 per list). Missing: a Preferences ▸ Trust Manager panel to edit the lists in the UI (tool only), an Open-in-default-application action in the panel (it opens only PDFs in a tab and saves others), JavaScript exportDataObject/launch and /Launch or /GoToE actions to embedded files (not executed today, so not checked), Acrobat's exact default list (ours is our own), and persistence for headless sessions (CLI/MCP keep the lists until the session ends)."

