notes = "Export to Word, HTML, RTF, Excel, PowerPoint (editable mode) and text takes ocr auto (default, as Acrobat's export setting)/on/off and ocr_language (any code the selected OCR engine reads; en with the built-in one). Session::with_export_ocr reads with the session's selected engine (ocr.ocr-engines) and recognizes the exported pages that need it (auto: scans, pages with an image and no text; on: every page without text) on a temporary copy of the working file and exports that copy; the document, its history and dirty state never change. auto exports without recognition, saying why (no models, the engine can't run or doesn't read the language, or the document's permissions forbid recognition); on fails instead. Each export reports pages without text, scanned pages, recognized pages, skipped pages and words. Recognized text is the invisible Searchable Image (Exact) layer, so the exports hold the recognized paragraphs and also the scan image itself (Acrobat drops the text from the picture); fonts, sizes and styles are not recovered from the scan. Real-model test on one original 200 dpi synthetic page per format (recall >= 80%, none of the words with ocr off); English only with the built-in engine; no export dialog setting yet (the UI is being redesigned)."

