notes = "Opt-in deskew (dialog 'Deskew pages', default off) estimates skew within ±15° with original projection-profile code on a downscaled Otsu-binarized copy (0.5° then 0.1° steps) and recognizes a straightened copy; words map back through the documented affine transform, the page image is never altered. Executed with the pinned models on one original synthetic page skewed ±3/±7° (and 93/173/263°): detected skew within 0.1°, 30/30 words at ±3° and 29/30 at ±7° (one word misread after two resamplings), reading order 0.97–1.00, every recognized word on its visible word; at -7° without deskew 21/30 words, order 0.70. Not yet: visible-page straightening (Acrobat-style deskewed image output), real scans, mixed-skew or curved pages, skew beyond ±15°."

[[feature]]
id = "ocr.despeckle"
title = "Despeckle"
area = "I"
tier = "P1"
milestone = "M10"
status = "partial"
commands = []
tools = ["scan_despeckle", "ocr_recognize", "ocr_prepare", "ocr_recognize_files"]
evidence = ["crates/optimize/src/despeckle.rs::specks_are_removed_and_text_strokes_and_dots_kept", "crates/optimize/src/despeckle.rs::levels_remove_only_specks_up_to_their_size", "crates/optimize/src/despeckle.rs::work_is_capped_on_pathological_noise", "crates/optimize/tests/despeckle.rs::scans_lose_their_specks_and_keep_text_and_punctuation", "crates/engine/tests/despeckle.rs::recognition_reads_a_despeckled_copy_and_exact_keeps_the_page", "crates/engine/tests/despeckle.rs::searchable_image_despeckles_the_page_in_the_recognition_step", "crates/engine/tests/despeckle.rs::despeckle_scans_is_one_undoable_step_reporting_what_changed", "crates/automation/tests/automation.rs::scan_despeckle_removes_specks_as_one_undoable_step_and_rejects_bad_arguments"]
notes = "Original connected-component despeckle (crates/optimize/src/despeckle.rs): dark specks that fit a square sized by the image's resolution (low 0.13 mm, medium 0.21 mm, high 0.34 mm; 2/3/4 px at 300 dpi) are removed unless text-sized ink lies within dpi/24 (3 pt) of them, which keeps periods, commas and i-dots; optional light-hole filling (pinholes in solid ink, not letter counters) and an opt-in impulse median for gray/colour. Recognize Text takes despeckle off|low|medium|high (+ despeckle_light, despeckle_median): recognition reads a despeckled copy; with output straighten (Searchable Image) the recognized pages' images are despeckled too in the same undo step. scan_despeckle is the standalone Enhance-scan operation (one undoable Edit::DespecklePageImages): one-bit images (CCITT fax re-encoded as G4, Flate/LZW) stay one-bit; 8-bit gray/RGB are rewritten (JPEG at q90). Measured only on synthetic fixtures. Not yet: a dialog/UI option, JBIG2/JPEG 2000/CMYK images (left alone, counted as skipped), real scans, ellipses at high level on small type (a trailing dot farther than ~3-6 pt from a letter can go), the other Enhance filters."

[[feature]]
id = "ocr.background-removal"
title = "Background removal"
area = "I"
tier = "P1"
milestone = "M10"
status = "partial"
commands = []
tools = ["scan_remove_background", "ocr_recognize", "ocr_prepare", "ocr_recognize_files"]
evidence = ["crates/optimize/src/background.rs::grey_paper_becomes_white_and_ink_and_pencil_stay", "crates/optimize/src/background.rs::yellowed_colour_paper_turns_neutral_white_and_colour_ink_stays", "crates/optimize/src/background.rs::photographs_and_dark_pages_are_left_alone", "crates/optimize/tests/background.rs::scans_get_white_paper_and_keep_their_text", "crates/engine/tests/background.rs::recognition_reads_a_whitened_copy_and_exact_keeps_the_page", "crates/engine/tests/background.rs::searchable_image_whitens_the_page_in_the_recognition_step", "crates/engine/tests/background.rs::remove_scan_backgrounds_is_one_undoable_step_reporting_what_changed", "crates/automation/tests/automation.rs::scan_remove_background_whitens_paper_as_one_undoable_step_and_rejects_bad_arguments"]
notes = "Original histogram method (crates/optimize/src/background.rs): the paper level is the main light peak (luma >= 128) of the image's smoothed luma histogram, refused when fewer than 30 % of the pixels lie within 16 levels of it (photographs, dark and inverted scans are left alone); the white point is paper - (base + k*sigma) with the paper noise sigma measured on the ink-free light side (low 6+1.5 sigma, medium 12+2.5 sigma, high 20+3.5 sigma, margin capped at 64, never below 128) or an explicit white_point; a levels curve keeps [0, white-64], stretches up to white and maps the rest to 255, so ink and mid-greys keep their values; colour scans use per-channel white points from the paper's own colour (yellowed paper becomes neutral white). scan_remove_background is the standalone Enhance-scan operation (one undoable Edit::RemovePageImageBackgrounds): 8-bit gray/RGB images are rewritten (JPEG at q90); one-bit images are left as they are. Recognize Text takes background off|low|medium|high (+ background_white_point): recognition reads a whitened copy (before despeckle); with output straighten (Searchable Image) the recognized pages' images are whitened too in the same undo step. Measured only on synthetic fixtures. Not yet: a dialog/UI option, JPEG 2000/JBIG2/CMYK/Indexed images (left alone, counted as skipped), uneven backgrounds (shadows, gradients across the page: one global level per image, no local/adaptive estimate), bleed-through removal, real scans."

