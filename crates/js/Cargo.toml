[package]
name = "pdfcraft-js"
description = "PDF JavaScript: a sandboxed interpreter (boa) with the form object model subset (event, getField, app, util, console)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }

[target.'cfg(target_os = "wasi")'.dependencies]
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
# Pinned interpreter series: optimized native containment regressions are release gates.
wasmi = { version = "=1.1.0", default-features = false, features = ["std"] }
web-time = "1"
