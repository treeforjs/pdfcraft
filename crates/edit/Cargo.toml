[package]
name = "pdfcraft-edit"
description = "Page content editing: headers and footers, watermarks, backgrounds, Bates numbers (ISO 32000-2 §14.8)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-annot = { workspace = true }
pdfcraft-cos = { workspace = true }
pdfcraft-content = { workspace = true }
pdfcraft-fonts = { workspace = true }
pdfcraft-model = { workspace = true }
thiserror = { workspace = true }
# Display order of right-to-left lines in added text; already in the tree via the interface.
unicode-bidi = "0.3"
# Arabic presentation forms ↔ letters for editing existing right-to-left text; already in the
# tree via stringprep.
unicode-normalization = "0.1"
# JPEG decoding and encoding for Convert Colors (zune-jpeg); already in the tree via pdfcraft-optimize.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
pdfcraft-filters = { workspace = true }

[dev-dependencies]
hayro-syntax = { workspace = true }
